# Site configuration
title: Chris Harris (loosepin313)
email: chris.m.harris@gmail.com
description: >-
  Personal website and blog of Chris Harris — Senior Infrastructure / DevOps Engineer focused on
  all the stuff and things.
url: "https://loosepin313.github.io"
baseurl: ""
github_username: loosepin313

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: "/:year/:month/:day/:title/"

# Keep build output clean
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
